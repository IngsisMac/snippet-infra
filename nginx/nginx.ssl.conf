events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # Los nombres se resuelven con el DNS interno de Docker en cada request (resolver +
    # variable en proxy_pass). Con `upstream` fijo NGINX cachea la IP al arrancar y, cuando
    # un servicio se recrea con otra IP, devuelve 502 hasta reiniciar el gateway.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # 1. Servidor HTTP (Puerto 80):
    # - Responde desafíos ACME de Let's Encrypt para renovaciones
    # - Redirige todo el resto del tráfico a HTTPS (Puerto 443)
    server {
        listen 80;
        server_name _;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # 2. Servidor HTTPS (Puerto 443) con Terminación TLS
    server {
        listen 443 ssl;
        server_name _;

        # Certificados Let's Encrypt montados desde el host
        ssl_certificate     /etc/letsencrypt/live/snippet-cert/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/snippet-cert/privkey.pem;

        # Parámetros y ciphers TLS seguros
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers HIGH:!aNULL:!MD5;

        set $snippet_service    http://snippet-service:8080;
        set $permission_service http://snippet-permission-service:8081;
        set $snippet_ui         http://snippet-ui:80;

        # Rutas internas: solo accesibles desde la red Docker (Decisiones D7 y D8).
        # /runner  -> snippet-runner-service (no tiene upstream: nunca se rutea)
        # /internal -> endpoints de servicio a servicio (permisos por userId, reglas de terceros)
        # /v1/asset -> snippet-asset-service (el contenido se sirve via /api/snippets/{id}/content)
        location /runner {
            return 403 "Forbidden: internal service.\n";
        }

        location /internal {
            return 403 "Forbidden: internal API.\n";
        }

        location /v1/asset {
            return 403 "Forbidden: internal service.\n";
        }

        # Stream SSE de una ejecucion interactiva (US #9 y #10). Necesita su propio bloque:
        # con el buffering por defecto NGINX junta los eventos y el output deja de verse en vivo,
        # y el read timeout de 60 s cortaria una ejecucion que espera que una persona escriba.
        location ~ ^/api/snippets/[^/]+/executions/[^/]+/stream$ {
            proxy_pass $snippet_service;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_cache off;
            proxy_set_header Connection "";
            proxy_read_timeout 600s;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Ruteo a snippet-service (Metadata, Test Cases, Compliance)
        location /api/snippets {
            proxy_pass $snippet_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Directorio de usuarios para compartir (US #7), tambien en snippet-permission-service
        location /api/users {
            proxy_pass $permission_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Ruteo a snippet-permission-service (Ownership, Shares, Rules)
        location /api/permissions {
            proxy_pass $permission_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Healthcheck endpoint del gateway
        location /health {
            return 200 "Gateway healthy\n";
        }

        # Ruteo por defecto a snippet-ui (Frontend React estático)
        location / {
            proxy_pass $snippet_ui;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
