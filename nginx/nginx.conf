events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    upstream snippet_service {
        server snippet-service:8080;
    }

    upstream permission_service {
        server snippet-permission-service:8081;
    }

    upstream snippet_ui {
        server snippet-ui:80;
    }

    server {
        listen 80;
        server_name localhost;

        # Rutas internas: solo accesibles desde la red Docker (Decisiones D7 y D8).
        # /runner  -> snippet-runner-service (no tiene upstream: nunca se rutea)
        # /internal -> endpoints de servicio a servicio (permisos por userId, reglas de terceros)
        # /v1/asset -> snippet-asset-service (el contenido se sirve via /api/snippets/{id}/content)
        location /runner {
            return 403 "Forbidden: internal service.\n";
        }

        location /internal {
            return 403 "Forbidden: internal API.\n";
        }

        location /v1/asset {
            return 403 "Forbidden: internal service.\n";
        }

        # Ruteo a snippet-service (Metadata, Test Cases, Compliance)
        location /api/snippets {
            proxy_pass http://snippet_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Ruteo a snippet-permission-service (Ownership, Shares, Rules)
        location /api/permissions {
            proxy_pass http://permission_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Healthcheck endpoint del gateway
        location /health {
            return 200 "Gateway healthy\n";
        }

        # Ruteo por defecto a snippet-ui (Frontend React estático)
        location / {
            proxy_pass http://snippet_ui;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
