name: Deploy Swarm Stacks

on:
  push:
    branches:
      - dev
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod
      stack:
        description: 'Stack to deploy'
        required: true
        default: 'apps'
        type: choice
        options:
          - apps
          - gateway
          - data
          - all
      tag:
        description: 'Image tag to deploy (sha-... or latest/dev)'
        required: false
        default: ''
  repository_dispatch:
    types:
      - deploy-stack
      - deploy-service

concurrency:
  group: deploy-${{ github.event.client_payload.environment || inputs.environment || github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Determine target environment
        id: env
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TARGET="${{ inputs.environment }}"
            TAG="${{ inputs.tag }}"
            STACK="${{ inputs.stack }}"
          elif [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            TARGET="${{ github.event.client_payload.environment || 'dev' }}"
            TAG="${{ github.event.client_payload.tag }}"
            SERVICE="${{ github.event.client_payload.service }}"
            STACK="${{ github.event.client_payload.stack || 'apps' }}"
          elif [ "${{ github.ref_name }}" = "main" ]; then
            TARGET="prod"
            TAG="latest"
            STACK="auto"
          else
            TARGET="dev"
            TAG="dev"
            STACK="auto"
          fi

          if [ -z "$TAG" ]; then
            if [ "$TARGET" = "prod" ]; then TAG="latest"; else TAG="dev"; fi
          fi

          echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "service=$SERVICE" >> "$GITHUB_OUTPUT"
          echo "stack=$STACK" >> "$GITHUB_OUTPUT"
          echo "azure=${{ secrets.AZURE_CREDENTIALS != '' }}" >> "$GITHUB_OUTPUT"

          if [ "$TARGET" = "prod" ]; then
            echo "host=${{ secrets.VM_PROD_HOST }}" >> "$GITHUB_OUTPUT"
            echo "vm_name=${{ secrets.AZURE_VM_PROD_NAME || 'vm-prod-ingsis' }}" >> "$GITHUB_OUTPUT"
            echo "ref=main" >> "$GITHUB_OUTPUT"
            echo "nr_suffix=prod" >> "$GITHUB_OUTPUT"
          else
            echo "host=${{ secrets.VM_DEV_HOST }}" >> "$GITHUB_OUTPUT"
            echo "vm_name=${{ secrets.AZURE_VM_DEV_NAME || 'vm-dev-ingsis' }}" >> "$GITHUB_OUTPUT"
            echo "ref=dev" >> "$GITHUB_OUTPUT"
            echo "nr_suffix=dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.env.outputs.ref }}

      - name: Detect changed stacks
        if: steps.env.outputs.stack == 'auto'
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            data:
              - 'stacks/data.yml'
            gateway:
              - 'stacks/gateway.yml'
              - 'nginx/**'
            apps:
              - 'stacks/apps.yml'

      - name: Azure Login
        if: steps.env.outputs.azure == 'true'
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Start Azure VM
        if: steps.env.outputs.azure == 'true'
        env:
          AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP || 'rg-ingsis' }}
          VM_NAME: ${{ steps.env.outputs.vm_name }}
        run: az vm start --resource-group "$AZURE_RESOURCE_GROUP" --name "$VM_NAME"

      - name: Setup SSH Agent for Docker Context
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ (steps.env.outputs.target == 'prod' && secrets.SSH_PRIVATE_KEY_PROD) || secrets.SSH_PRIVATE_KEY_DEV || secrets.SSH_PRIVATE_KEY }}

      - name: Trust VM host key
        env:
          VM_HOST: ${{ steps.env.outputs.host }}
        run: |
          mkdir -p ~/.ssh
          for i in {1..12}; do
            ssh-keyscan -H "$VM_HOST" >> ~/.ssh/known_hosts 2>/dev/null && grep -q . ~/.ssh/known_hosts && exit 0
            sleep 5
          done
          echo "::error::Could not reach SSH on $VM_HOST"
          exit 1

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Update single service (granular deploy)
        if: steps.env.outputs.service != ''
        env:
          DOCKER_HOST: ssh://azureuser@${{ steps.env.outputs.host }}
          SERVICE: ${{ steps.env.outputs.service }}
          TAG: ${{ steps.env.outputs.tag }}
        run: |
          docker service update \
            --image "ghcr.io/ingsismac/${SERVICE}:${TAG}" \
            --with-registry-auth \
            "snippet-apps_${SERVICE}"

      - name: Deploy data stack
        if: steps.env.outputs.service == '' && (steps.env.outputs.stack == 'all' || steps.env.outputs.stack == 'data' || steps.changes.outputs.data == 'true')
        env:
          DOCKER_HOST: ssh://azureuser@${{ steps.env.outputs.host }}
          HOSTNAME: ${{ steps.env.outputs.vm_name }}
        run: docker stack deploy -c stacks/data.yml snippet-data --with-registry-auth

      - name: Deploy gateway stack
        if: steps.env.outputs.service == '' && (steps.env.outputs.stack == 'all' || steps.env.outputs.stack == 'gateway' || steps.changes.outputs.gateway == 'true')
        env:
          DOCKER_HOST: ssh://azureuser@${{ steps.env.outputs.host }}
          TAG: ${{ steps.env.outputs.tag }}
        run: |
          NGINX_CONF_HASH=$(sha256sum nginx/nginx.ssl.conf | cut -c1-8)
          export NGINX_CONF_VERSION="${TAG}_${NGINX_CONF_HASH}"
          docker stack deploy -c stacks/gateway.yml snippet-gateway --with-registry-auth

      - name: Deploy apps stack
        if: steps.env.outputs.service == '' && (steps.env.outputs.stack == 'all' || steps.env.outputs.stack == 'apps' || steps.changes.outputs.apps == 'true')
        env:
          DOCKER_HOST: ssh://azureuser@${{ steps.env.outputs.host }}
          TAG: ${{ steps.env.outputs.tag }}
          AUTH0_ISSUER_URI: ${{ secrets.AUTH0_ISSUER_URI }}
          AUTH0_AUDIENCE: ${{ secrets.AUTH0_AUDIENCE }}
          AUTH0_M2M_ENABLED: ${{ secrets.AUTH0_M2M_ENABLED }}
          NEW_RELIC_AGENT_ENABLED: ${{ secrets.NEW_RELIC_AGENT_ENABLED || 'true' }}
          NEW_RELIC_ENV_SUFFIX: ${{ steps.env.outputs.nr_suffix }}
        run: docker stack deploy -c stacks/apps.yml snippet-apps --with-registry-auth
