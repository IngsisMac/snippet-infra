name: Sync Swarm Secrets

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod

jobs:
  sync-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Determine target host
        id: env
        run: |
          if [ "${{ inputs.environment }}" = "prod" ]; then
            echo "host=${{ secrets.VM_PROD_HOST }}" >> "$GITHUB_OUTPUT"
            echo "vm_name=${{ secrets.AZURE_VM_PROD_NAME || 'vm-prod-ingsis' }}" >> "$GITHUB_OUTPUT"
          else
            echo "host=${{ secrets.VM_DEV_HOST }}" >> "$GITHUB_OUTPUT"
            echo "vm_name=${{ secrets.AZURE_VM_DEV_NAME || 'vm-dev-ingsis' }}" >> "$GITHUB_OUTPUT"
          fi
          echo "azure=${{ secrets.AZURE_CREDENTIALS != '' }}" >> "$GITHUB_OUTPUT"

      - name: Azure Login
        if: steps.env.outputs.azure == 'true'
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Start Azure VM
        if: steps.env.outputs.azure == 'true'
        env:
          AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP || 'rg-ingsis' }}
          VM_NAME: ${{ steps.env.outputs.vm_name }}
        run: az vm start --resource-group "$AZURE_RESOURCE_GROUP" --name "$VM_NAME"

      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ (inputs.environment == 'prod' && secrets.SSH_PRIVATE_KEY_PROD) || secrets.SSH_PRIVATE_KEY_DEV || secrets.SSH_PRIVATE_KEY }}

      - name: Trust VM host key
        env:
          VM_HOST: ${{ steps.env.outputs.host }}
        run: |
          mkdir -p ~/.ssh
          for i in {1..12}; do
            ssh-keyscan -H "$VM_HOST" >> ~/.ssh/known_hosts 2>/dev/null && grep -q . ~/.ssh/known_hosts && exit 0
            sleep 5
          done
          exit 1

      - name: Create or rotate Docker Swarm secrets
        env:
          DOCKER_HOST: ssh://azureuser@${{ steps.env.outputs.host }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD || 'postgres' }}
          AUTH0_M2M_CLIENT_ID: ${{ secrets.AUTH0_M2M_CLIENT_ID }}
          AUTH0_M2M_CLIENT_SECRET: ${{ secrets.AUTH0_M2M_CLIENT_SECRET }}
          NEW_RELIC_LICENSE_KEY: ${{ secrets.NEW_RELIC_LICENSE_KEY }}
        run: |
          upsert_secret() {
            local name="$1"
            local value="$2"
            [ -z "$value" ] && return 0
            docker secret rm "$name" >/dev/null 2>&1 || true
            printf '%s' "$value" | docker secret create "$name" -
          }

          upsert_secret "postgres_password" "$POSTGRES_PASSWORD"
          upsert_secret "auth0_m2m_client_id" "$AUTH0_M2M_CLIENT_ID"
          upsert_secret "auth0_m2m_client_secret" "$AUTH0_M2M_CLIENT_SECRET"

          if [ -n "$NEW_RELIC_LICENSE_KEY" ]; then
            upsert_secret "newrelic_yml" "common: &default_settings
  license_key: ${NEW_RELIC_LICENSE_KEY}"
            upsert_secret "newrelic_infra_yml" "license_key: ${NEW_RELIC_LICENSE_KEY}"
          fi
